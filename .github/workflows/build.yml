name: Build unthemidator (Windows x64)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install CMake 4.x
        shell: pwsh
        run: |
          $ver = "4.0.1"
          $url = "https://github.com/Kitware/CMake/releases/download/v$ver/cmake-$ver-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\cmake.zip"
          Expand-Archive "$env:RUNNER_TEMP\cmake.zip" -DestinationPath "$env:RUNNER_TEMP\cmake"
          $cmakeBin = "$env:RUNNER_TEMP\cmake\cmake-$ver-windows-x86_64\bin"
          Write-Output "$cmakeBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$cmakeBin\cmake.exe" --version

      - name: Show workspace
        shell: pwsh
        run: |
          Get-ChildItem -Force
          Write-Host "--- dependencies ---"
          if (Test-Path dependencies) { Get-ChildItem -Force dependencies }

      - name: Configure CMake (Release, x64)
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DUNICORN_ARCH=x86 `
            -DUNICORN_BUILD_TESTS=OFF `
            -DZYDIS_BUILD_EXAMPLES=OFF `
            -DZYDIS_BUILD_TOOLS=OFF `
            -DZYDIS_BUILD_TESTS=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Locate artifact
        shell: pwsh
        run: |
          Get-ChildItem -Recurse build -Filter unthemidator.exe |
            Select-Object FullName, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unthemidator-win64
          path: |
            build/**/unthemidator.exe
            build/**/unthemidator.pdb
            static/catalog.json
            static/catalog_32.json
          if-no-files-found: error
